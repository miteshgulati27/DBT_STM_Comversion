<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM ↔ DBT Verifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>
        .drop-zone { transition: all 0.2s ease; }
        .drop-zone.dragover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        .sticky-header thead th { position: sticky; top: 0; z-index: 10; background: #1e293b; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-700 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center gap-3">
            <div class="w-10 h-10 bg-cyan-600 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">STM &#8596; DBT Verifier</h1>
                <p class="text-sm text-slate-400">Source-to-Target Mapping vs. model implementation, side by side</p>
            </div>
        </div>
    </header>

    <!-- Progress Bar -->
    <div class="bg-slate-900 border-b border-slate-800 px-6 py-3">
        <div class="max-w-7xl mx-auto">
            <div class="flex items-center justify-center gap-0">
                <div class="flex items-center">
                    <div id="step1-indicator" class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-cyan-600 text-white">1</div>
                    <span class="ml-2 text-sm font-medium text-white">Upload Files</span>
                </div>
                <div class="w-16 h-0.5 bg-slate-600 mx-4" id="connector-1-2"></div>
                <div class="flex items-center">
                    <div id="step2-indicator" class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-slate-600 text-slate-300">2</div>
                    <span class="ml-2 text-sm font-medium text-slate-400">Select Models</span>
                </div>
                <div class="w-16 h-0.5 bg-slate-600 mx-4" id="connector-2-3"></div>
                <div class="flex items-center">
                    <div id="step3-indicator" class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-slate-600 text-slate-300">3</div>
                    <span class="ml-2 text-sm font-medium text-slate-400">Results</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
